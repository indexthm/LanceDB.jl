name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Test without optional packages
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.instantiate()
          using LanceDB
          @assert Base.get_extension(LanceDB, :LanceDBArrowExt) === nothing
      - name: Test package and optional integration
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.test()'
